# Synology packages for the releases page.
#
# Triggered by a v1.2.3 style tag: builds the .spk for both architectures and
# attaches them to the release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a trial build (nothing is published without a tag)
        required: false
        default: 0.0.0

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  spk:
    name: Build the DSM packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          ./tools/build-spk.sh amd64 "${{ steps.version.outputs.value }}"
          ./tools/build-spk.sh arm64 "${{ steps.version.outputs.value }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: spk
          path: dist/*.spk

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.spk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.spk --clobber

  # The catalogue for the Package Center "Package Sources": one static file
  # per architecture. The .spk files live in the release — the page only tells
  # the Package Center where to get them.
  pages:
    name: Package catalogue
    needs: spk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalogue
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) : ;; *) version="$version-1" ;; esac
          python3 tools/make-feed.py "$version" --out public
          cp spk/PACKAGE_ICON.PNG public/icon_72.png
          cp spk/PACKAGE_ICON_256.PNG public/icon_256.png
          ls public/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
