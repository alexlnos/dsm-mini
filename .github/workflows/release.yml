# Пакеты Synology для страницы релизов.
#
# Срабатывает на тег вида v1.2.3: собирает .spk под обе архитектуры и
# прикладывает их к релизу. Docker-образ на тот же тег собирает docker.yml.
name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Версия для пробной сборки (без тега ничего не публикуется)
        required: false
        default: 0.0.0

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  spk:
    name: Собрать пакеты DSM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Версия
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Сборка
        run: |
          ./tools/build-spk.sh amd64 "${{ steps.version.outputs.value }}"
          ./tools/build-spk.sh arm64 "${{ steps.version.outputs.value }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: spk
          path: dist/*.spk

      - name: Приложить к релизу
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.spk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.spk --clobber

  # Каталог для «Источников пакетов» Центра пакетов: один статический файл на
  # архитектуру. Сами .spk лежат в релизе — страница только говорит Центру
  # пакетов, где их взять.
  pages:
    name: Каталог пакетов
    needs: spk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать каталог
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) : ;; *) version="$version-1" ;; esac
          python3 tools/make-feed.py "$version" --out public
          cp spk/PACKAGE_ICON.PNG public/icon_72.png
          cp spk/PACKAGE_ICON_256.PNG public/icon_256.png
          ls public/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
