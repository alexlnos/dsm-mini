# Image build and publishing to Docker Hub.
#
# Triggered on a push to main (the latest tag) and on v1.2.3 style tags.
# It can also be started by hand with Run workflow on the Actions tab.
#
# It needs two repository secrets — how to create them is in the README,
# section "Building your own image".
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: dsm-mini

jobs:
  # The image is not published until the checks have passed.
  tests:
    uses: ./.github/workflows/ci.yml

  push:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # Without this check a missing secret looks like an obscure login error
      # somewhere in the middle of the build.
      - name: Docker Hub secrets are set
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are missing. Settings → Secrets and variables → Actions → New repository secret. Details in the README, section 'Building your own image'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=dsm-mini
            org.opencontainers.image.description=Telegram bot with a Mini App for managing a Synology NAS

      # arm64 is cross-compiled rather than emulated: the binary is static and
      # nothing runs inside the target image. So QEMU is not needed and the
      # build takes minutes instead of half an hour.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What was published
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
