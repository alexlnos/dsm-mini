# Сборка образа и публикация в Docker Hub.
#
# Срабатывает на push в main (тег latest) и на теги вида v1.2.3 (теги версии).
# Запустить вручную можно кнопкой Run workflow на вкладке Actions.
#
# Нужны два секрета репозитория — как их завести, написано в README,
# раздел «Собирать свой образ».
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: dsm-mini

jobs:
  # Образ не публикуется, пока не прошли проверки.
  tests:
    uses: ./.github/workflows/ci.yml

  push:
    name: Собрать и опубликовать
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # Без этой проверки отсутствие секретов выглядит как невнятная ошибка
      # входа где-то в середине сборки.
      - name: Секреты Docker Hub заданы
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::Нет секретов DOCKERHUB_USERNAME и DOCKERHUB_TOKEN. Settings → Secrets and variables → Actions → New repository secret. Подробности в README, раздел «Собирать свой образ»."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=dsm-mini
            org.opencontainers.image.description=Telegram-бот с Mini App для управления Synology NAS

      # arm64 собирается кросс-компиляцией, а не эмуляцией: бинарник
      # статический, а в целевом образе ничего не выполняется. Поэтому QEMU
      # не нужен, и сборка занимает минуты, а не полчаса.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что опубликовано
        run: |
          echo "### Образ опубликован" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
