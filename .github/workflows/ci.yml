# Checks on every push and pull request.
#
# The same file is called from docker.yml: the image is not published until
# the checks pass. That keeps a build with failing tests out of Docker Hub.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt: $unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Integration tests need a live NAS and are skipped by default.
      - run: go test ./...

  web:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Types
        run: npx tsc --noEmit
        working-directory: web

      - run: npm run build
        working-directory: web

      # The built frontend lives in the repository: go:embed picks it up. If
      # the build drifts from what is committed, the binary ships an old
      # interface — and a green CI alone will never reveal it.
      - name: The built interface matches the committed one
        run: |
          if ! git diff --quiet -- internal/web/dist; then
            echo "::error::internal/web/dist differs from the build result. Run 'cd web && npm run build' and commit it."
            git diff --stat -- internal/web/dist
            exit 1
          fi

  spk:
    name: DSM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The package is built with plain tar, without the Synology toolkit: the
      # binary is static. We check that it builds at all and holds what it
      # should — otherwise only whoever downloaded the release notices.
      - name: Build the .spk
        run: ./tools/build-spk.sh amd64 0.0.0-ci

      - name: Check the contents
        run: |
          spk=dist/dsm-mini-0.0.0-ci-amd64.spk
          for entry in package.tgz INFO scripts/start-stop-status scripts/postinst \
                       conf/privilege WIZARD_UIFILES/install_uifile PACKAGE_ICON.PNG; do
            tar tf "$spk" | grep -qx "$entry" || { echo "::error::the package lacks $entry"; exit 1; }
          done
          tar xOf "$spk" package.tgz | tar tzf - | grep -qx './bin/dsm-mini' \
            || { echo "::error::package.tgz has no binary"; exit 1; }
          echo "the package contents are fine"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same compose lives in deploy/ and as a copy in the README: people
      # install the service by copying it straight out of the instructions.
      # Let them drift and half the readers get a stale file without knowing.
      - name: The compose in the README matches the file
        run: |
          python3 - <<'CHECK'
          compose = open('deploy/docker-compose.yml', encoding='utf-8').read().rstrip()
          readme = open('README.md', encoding='utf-8').read()
          if compose not in readme:
              print('::error::The compose block in the README drifted from deploy/docker-compose.yml. '
                    'Paste the current file contents into the README.')
              raise SystemExit(1)
          print('matches')
          CHECK
