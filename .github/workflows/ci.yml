# Checks on every push and pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt: $unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Integration tests need a live NAS and are skipped by default.
      - run: go test ./...

  web:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Types
        run: npx tsc --noEmit
        working-directory: web

      - run: npm run build
        working-directory: web

      # The built frontend lives in the repository: go:embed picks it up. If
      # the build drifts from what is committed, the binary ships an old
      # interface — and a green CI alone will never reveal it.
      - name: The built interface matches the committed one
        run: |
          if ! git diff --quiet -- internal/web/dist; then
            echo "::error::internal/web/dist differs from the build result. Run 'cd web && npm run build' and commit it."
            git diff --stat -- internal/web/dist
            exit 1
          fi

  spk:
    name: DSM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The package is built with plain tar, without the Synology toolkit: the
      # binary is static. We check that it builds at all and holds what it
      # should — otherwise only whoever downloaded the release notices.
      - name: Build the .spk
        run: ./tools/build-spk.sh amd64 0.0.0-ci

      - name: Check the contents
        run: |
          spk=dist/dsm-mini-0.0.0-ci-amd64.spk
          for entry in package.tgz INFO scripts/start-stop-status scripts/postinst \
                       conf/privilege WIZARD_UIFILES/install_uifile PACKAGE_ICON.PNG; do
            tar tf "$spk" | grep -qx "$entry" || { echo "::error::the package lacks $entry"; exit 1; }
          done
          tar xOf "$spk" package.tgz | tar tzf - | grep -qx './bin/dsm-mini' \
            || { echo "::error::package.tgz has no binary"; exit 1; }
          echo "the package contents are fine"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The README exists in ten languages, and every one of them carries the
      # links to the other nine. Add a language and forget one line, and the
      # new README is reachable from nowhere — which nobody notices, because
      # each file looks fine on its own.
      - name: The language links in the READMEs are in step
        run: |
          python3 - <<'CHECK'
          # file -> the name the link to it is written under
          LANGS = {
              'README.md': 'English',
              'README_RU.md': 'Русский',
              'README_ES.md': 'Español',
              'README_PT.md': 'Português',
              'README_DE.md': 'Deutsch',
              'README_FR.md': 'Français',
              'README_IT.md': 'Italiano',
              'README_TR.md': 'Türkçe',
              'README_UK.md': 'Українська',
              'README_PL.md': 'Polski',
          }
          import os

          problems = []
          for name, title in LANGS.items():
              if not os.path.exists(name):
                  problems.append(f'{name} is missing')
                  continue
              head = open(name, encoding='utf-8').read(4000)
              if f'**{title}**' not in head:
                  problems.append(f'{name}: it does not name itself as **{title}**')
              for other, other_title in LANGS.items():
                  if other == name:
                      continue
                  if f'[{other_title}]({other})' not in head:
                      problems.append(f'{name}: no link to {other} as [{other_title}]')

          if problems:
              for p in problems:
                  print(f'::error::{p}')
              raise SystemExit(1)
          print(f'{len(LANGS)} READMEs, the links are in step')
          CHECK

      # The wizard files are generated from the table in make-wizard.py and
      # committed. Edit the table, forget to regenerate, and the installer
      # keeps showing the old questions while the source says otherwise.
      - name: The wizard files match the generator
        run: |
          python3 tools/make-wizard.py
          if ! git diff --quiet -- spk/WIZARD_UIFILES; then
            echo "::error::spk/WIZARD_UIFILES differs from the generator result. Run 'python3 tools/make-wizard.py' and commit it."
            git diff --stat -- spk/WIZARD_UIFILES
            exit 1
          fi
