# Проверки на каждый push и pull request.
#
# Этот же файл вызывается из docker.yml: образ не публикуется, пока проверки
# не прошли. Так в Docker Hub не попадает сборка с падающими тестами.
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Не отформатировано gofmt: $unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Интеграционные тесты требуют живого NAS и по умолчанию пропускаются.
      - run: go test ./...

  web:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Типы
        run: npx tsc --noEmit
        working-directory: web

      - run: npm run build
        working-directory: web

      # Собранный фронтенд лежит в репозитории: его забирает go:embed. Если
      # сборка разошлась с тем, что закоммичено, бинарник будет со старым
      # интерфейсом — и понять это по одному лишь зелёному CI невозможно.
      - name: Собранный интерфейс совпадает с закоммиченным
        run: |
          if ! git diff --quiet -- internal/web/dist; then
            echo "::error::internal/web/dist отличается от результата сборки. Выполните 'cd web && npm run build' и закоммитьте результат."
            git diff --stat -- internal/web/dist
            exit 1
          fi

  spk:
    name: Пакет DSM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Пакет собирается обычным tar, без тулкита Synology: бинарник
      # статический. Проверяем, что он вообще собирается и внутри лежит то,
      # что нужно, — иначе поломку заметит только тот, кто скачал релиз.
      - name: Собрать .spk
        run: ./tools/build-spk.sh amd64 0.0.0-ci

      - name: Проверить состав
        run: |
          spk=dist/dsm-mini-0.0.0-ci-amd64.spk
          for entry in package.tgz INFO scripts/start-stop-status scripts/postinst \
                       conf/privilege WIZARD_UIFILES/install_uifile PACKAGE_ICON.PNG; do
            tar tf "$spk" | grep -qx "$entry" || { echo "::error::в пакете нет $entry"; exit 1; }
          done
          tar xOf "$spk" package.tgz | tar tzf - | grep -qx './bin/dsm-mini' \
            || { echo "::error::в package.tgz нет бинарника"; exit 1; }
          echo "состав пакета в порядке"

  docs:
    name: Документация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тот же compose лежит в deploy/ и копией в README: человек ставит
      # сервис, копируя его прямо из инструкции. Разойдутся — и половина
      # читателей получит устаревший файл, не узнав об этом.
      - name: Compose в README совпадает с файлом
        run: |
          python3 - <<'CHECK'
          compose = open('deploy/docker-compose.yml', encoding='utf-8').read().rstrip()
          readme = open('README.md', encoding='utf-8').read()
          if compose not in readme:
              print('::error::Блок compose в README разошёлся с deploy/docker-compose.yml. '
                    'Вставьте в README актуальное содержимое файла.')
              raise SystemExit(1)
          print('совпадает')
          CHECK
