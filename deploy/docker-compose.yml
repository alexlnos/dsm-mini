services:
  dsm-mini:
    image: ghcr.io/alexlnos/dsm-mini:latest
    container_name: dsm-mini
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      # Наружу порт не публикуем: перед сервисом стоит reverse proxy,
      # который завершает TLS. Меняйте адрес привязки, если прокси на
      # другой машине.
      - "127.0.0.1:8080:8080"
    volumes:
      - dsm-mini-state:/data
    healthcheck:
      test: ["CMD", "/dsm-mini", "-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dsm-mini-state:
